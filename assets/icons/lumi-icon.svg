<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Lingkaran Luar Kompas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Cahaya Pendar -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Berlian Kristal Geometris Lumi -->
  <polygon points="256,90 350,220 256,420 162,220" fill="url(#crystalGrad)" filter="url(#glow)"/>
  
  <!-- Facet Cahaya Kristal -->
  <polygon points="256,90 256,420 162,220" fill="#ffffff" fill-opacity="0.25"/>
  <polygon points="256,90 350,220 256,220" fill="#38bdf8" fill-opacity="0.4"/>
  <polygon points="256,220 350,220 256,420" fill="#6366f1" fill-opacity="0.3"/>
  
  <!-- Mata Ramah Lumi (Karakter Geometris Pendamping) -->
  <circle cx="230" cy="210" r="10" fill="#ffffff"/>
  <circle cx="282" cy="210" r="10" fill="#ffffff"/>
  <circle cx="232" cy="211" r="5" fill="#0f172a"/>
  <circle cx="284" cy="211" r="5" fill="#0f172a"/>
  <!-- Senyum Hangat -->
  <path d="M 242 232 Q 256 244 270 232" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Titik Arah Mata Angin Geometris -->
  <circle cx="256" cy="65" r="8" fill="#facc15"/>
  <circle cx="447" cy="256" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="447" r="8" fill="#f472b6"/>
  <circle cx="65" cy="256" r="8" fill="#4ade80"/>
</svg>
